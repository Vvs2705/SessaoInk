name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint (ruff)
        # ruff lê configuração do pyproject.toml automaticamente
        run: pip install ruff && ruff check .
      - name: Type check (pyright)
        run: pip install pyright && pyright --pythonpath $(which python) app/ || true
      - name: Smoke test — imports
        run: python -c "from app.core.config import settings; from app.main import app; print('OK')"
        env:
          SECRET_KEY: ci-test-secret-key-32chars-minimum
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost/db
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # lucide-react@0.390 declara peer react@^18 mas funciona com React 19
      # Vercel usa --legacy-peer-deps internamente; replicamos aqui
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint -- --no-cache
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://sessao-ink.vercel.app

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
