name: LGPD Retention

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Executar sem alterar dados"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  anonymize-expired-public-budgets:
    name: Anonimizar orcamentos publicos expirados
    runs-on: ubuntu-latest
    env:
      API_URL: https://sessaoink-api.fly.dev
      LGPD_RETENTION_TOKEN: ${{ secrets.LGPD_RETENTION_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Validar secret obrigatorio
        run: |
          test -n "$LGPD_RETENTION_TOKEN"

      - name: Executar retencao LGPD
        run: |
          curl -fsS \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LGPD_RETENTION_TOKEN" \
            -d "{\"dry_run\":$DRY_RUN}" \
            "$API_URL/api/v1/admin/lgpd/anonimizar"
