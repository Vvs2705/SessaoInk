name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissões mínimas (P0-09 / hardening do GitHub Actions)
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-32chars-minimum
      REDIS_URL: redis://localhost:6379
      # Smoke test importa a app sem conftest; config exige DATABASE_URL.
      # ENVIRONMENT=test → guardrails de produção não se aplicam (localhost ok).
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências (runtime lock + dev pinadas)
        run: pip install --upgrade pip && pip install -r requirements.lock -r requirements-dev.txt
      - name: Lint (ruff) — bloqueante
        run: ruff check .
      - name: Type check (pyright) — bloqueante
        # pyrightconfig.json rebaixa falsos-positivos conhecidos a warning;
        # erros reais de tipo quebram o build.
        run: pyright
      - name: Testes (pytest) — bloqueante
        # Suíte usa SQLite + MockRedis (autocontida): unit + integração (RBAC,
        # tenant, segurança, auth, uploads). Versões pinadas em requirements-dev.txt.
        run: pytest -q
      - name: OpenAPI versionado — bloqueante
        run: python scripts/generate_openapi.py --output ../docs/openapi.json && git diff --exit-code -- ../docs/openapi.json
      - name: Smoke test — imports
        run: python -c "from app.core.config import settings; from app.main import app; print('OK')"

  migrations:
    name: Migrations (Postgres limpo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sessaoink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-32chars-minimum
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/sessaoink_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -r requirements.lock
      - name: alembic upgrade head — banco limpo
        run: alembic upgrade head
      - name: alembic upgrade head idempotente (segunda execução)
        run: alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Type check — bloqueante
        run: npx tsc --noEmit
      - name: Build — bloqueante
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://sessao-ink.vercel.app
      - name: npm audit (high+) — bloqueante
        run: npm audit --audit-level=high

  security-scan:
    name: Security Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend) — advisory
        # Advisory por ora: vulnerabilidades transitivas do ecossistema Python
        # exigem triagem de exploitabilidade antes de bloquear merge.
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r backend/requirements.lock

  docker-sbom:
    name: Docker/SBOM Scan (advisory)
    runs-on: ubuntu-latest
    # Advisory: Docker image CVEs and SBOM generation should surface risk without
    # blocking merges until findings are triaged and a blocking policy is defined.
    continue-on-error: true
    env:
      IMAGE_REF: sessaoink-backend:ci
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t "$IMAGE_REF" ./backend
      - name: Trivy image scan (high/critical) — advisory
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: "1"
      - name: Generate CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: cyclonedx
          output: sbom-backend.cdx.json
          exit-code: "0"
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend-cyclonedx
          path: sbom-backend.cdx.json
          if-no-files-found: warn

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
