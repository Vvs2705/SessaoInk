version: "3.9"

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sessaoink_api
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../storage:/storage
    restart: unless-stopped
    networks:
      - sessaoink_net

  db:
    image: postgres:16-alpine
    container_name: sessaoink_db
    environment:
      POSTGRES_DB: sessaoink
      POSTGRES_USER: sessaoink
      POSTGRES_PASSWORD: sessaoink_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessaoink -d sessaoink"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sessaoink_net

  redis:
    image: redis:7-alpine
    container_name: sessaoink_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sessaoink_net

volumes:
  pg_data:
  redis_data:

networks:
  sessaoink_net:
    driver: bridge
