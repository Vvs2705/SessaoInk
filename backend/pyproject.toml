[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sessaoink-api"
version = "1.0.0"
description = "SessãoInk — API de gestão para tatuadores e estúdios"
requires-python = ">=3.12"
# FONTE DA VERDADE de runtime: backend/requirements.txt (usado por Docker/Fly).
# Esta lista espelha requirements.txt — sem deps-fantasma (P0-06: removidos
# passlib, celery, python-magic, uuid7 — não usados no código).
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # ORM / Database
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    # Validação e configuração
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Auth / Segurança
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    # Cache
    "redis>=5.2.0",
    # Observabilidade / Email / Imagem
    "sentry-sdk[fastapi]>=2.0.0",
    "resend>=2.0.0",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.1",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402", "N806", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
log_cli = false

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
