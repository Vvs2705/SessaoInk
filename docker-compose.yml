version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sessaoink:sessaoink_dev@db:5432/sessaoink
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./storage:/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sessaoink
      POSTGRES_USER: sessaoink
      POSTGRES_PASSWORD: sessaoink_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
